<title>ShareTrip</title>
<!--
  Точка входа ТОЛЬКО для размещения в артефакте claude.ai.
  Площадка сама оборачивает файл в <!doctype html><head>…</head><body>, поэтому
  здесь нет ни <html>, ни <head>, ни <body>. Для обычного хостинга (VPS, Caddy
  file_server) точка входа — index.html рядом; разметка и скрипты общие, поэтому
  расходиться им негде.
-->
<link rel="stylesheet" href="css/app.css">
<style>
  /* Оболочка площадки задаёт свой фон и шрифт — возвращаем свои.
     Высоту здесь НЕ задаём: `height: 100%` пришпиливает body к высоте окна, и
     тогда нижний отступ применяется ВНУТРИ этой высоты, а не удлиняет полосу
     прокрутки — последние 30–40 px контента навсегда уезжают под нижнюю панель.
     Правило «height: 100% для одноэкранного приложения» — про экраны, которые
     прокручивают себя сами; ShareTrip прокручивается страницей (D-012). */
  body { background: var(--bg); color: var(--fg); font-family: var(--font); }
</style>

<div id="root">
  <div class="splash">
    <span class="wordmark-boot"><img src="assets/symbol.png" alt="" width="46" height="46"><span><b>Share</b><i>Trip</i></span></span>
    <p class="muted">Загружаю…</p>
  </div>
</div>

<noscript>
  <div class="splash">
    <h1>Нужен JavaScript</h1>
    <p class="muted">ShareTrip считает всё на устройстве, поэтому без JavaScript работать не может.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
